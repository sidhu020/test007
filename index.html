
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">

  <title>Event Check-In</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/html5-qrcode"
          defer></script>

  <script src="app.js" defer></script>
</head>

<body>

  <header class="header">
    <div class="logo">EVENT CHECK-IN</div>
    <div class="online">
      <span class="dot"></span> Desk Portal
    </div>
  </header>

  <main class="container">

    <section class="welcome">
      <h1>Guest Verification</h1>
      <p>Scan a ticket or enter a Guest ID.</p>
    </section>

    <section class="scanner-card">

      <div class="section-heading">
        <h2>QR Scanner</h2>
        <span class="tag">LIVE SCAN</span>
      </div>

      <div id="reader"></div>

      <div class="scanner-actions">
        <button id="startBtn" class="primary">
          Start Camera
        </button>

        <button id="stopBtn" class="secondary">
          Stop Camera
        </button>
      </div>

    </section>

    <section class="manual-card">

      <h2>Manual Guest Lookup</h2>

      <div class="input-row">
        <input
          type="text"
          id="guestCode"
          maxlength="4"
          placeholder="Enter Guest ID"
          autocomplete="off"
        >

        <button id="lookupBtn" class="primary">
          Verify
        </button>
      </div>

    </section>

    <section id="statusBox"
             class="status-box"
             aria-live="polite">
      Ready to scan tickets.
    </section>

    <section id="guestPanel"
             class="guest-card hidden">

      <div id="guestBadge" class="guest-badge">
        GUEST FOUND
      </div>

      <h2 id="guestName">Guest Name</h2>

      <div class="guest-details">
        <div>
          <span>Guest ID</span>
          <strong id="guestId">----</strong>
        </div>

        <div>
          <span>RSVP Status</span>
          <strong id="rsvpStatus">INVITED</strong>
        </div>

        <div>
          <span>Entry Status</span>
          <strong id="checkinStatus">
            NOT CHECKED IN
          </strong>
        </div>
      </div>

      <p id="previousTime" class="previous-time"></p>

      <div class="confirm-actions">
        <button id="confirmBtn" class="success">
          Confirm Guest Entry
        </button>

        <button id="cancelBtn" class="secondary">
          Cancel
        </button>
      </div>

    </section>

    <footer>
      Event Management System · Check-In Desk
    </footer>

  </main>

</body>
</html>
